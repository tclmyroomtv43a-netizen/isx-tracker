name: ISX daily collector

on:
  schedule:
    - cron: "0 8-13 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas openpyxl xlrd
      - name: Collect ISX data
        run: python isx_collector.py
      - name: Commit updated record
        run: |
          git config user.name "isx-bot"
          git config user.email "isx-bot@users.noreply.github.com"
          git add data
          git commit -m "ISX data update" || echo "No changes to commit."
          git push
